[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tensorsmith"
version = "0.3.0"
description = "A compact, from-scratch tensor and neural-network framework with dynamic autograd"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Kavin Prabhakar"}]
dependencies = ["numpy>=1.24"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
cuda = ["cupy-cuda12x>=13"]
cuda12 = ["cupy-cuda12x>=13"]
cuda13 = ["cupy-cuda13x>=14,<15"]
cuda13-ctk = ["cupy-cuda13x[ctk]>=14,<15"]
metal = ["mlx>=0.32; platform_system == 'Darwin' and platform_machine == 'arm64'"]
dev = ["pytest>=8", "ruff>=0.6"]
benchmark = ["torch>=2.2", "pillow>=10", "pyarrow>=15"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
